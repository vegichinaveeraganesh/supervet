<svg
  [attr.width]="size"
  [attr.height]="size"
  viewBox="0 0 24 24"
  fill="none"
  [attr.stroke]="color"
  [attr.stroke-width]="strokeWidth"
  stroke-linecap="round"
  stroke-linejoin="round"
  [class]="'icon icon--' + name"
>
  <ng-container [ngSwitch]="name">
    <!-- Stethoscope -->
    <ng-container *ngSwitchCase="'stethoscope'">
      <path d="M4.8 2.62a3 3 0 0 0-1.8 2.74v2.02c0 2.48 2.01 4.5 4.5 4.5s4.5-2.02 4.5-4.5V5.36a3 3 0 0 0-1.8-2.74"/>
      <path d="M12 7.5h1.5a3 3 0 0 1 3 3v2.25a4.5 4.5 0 0 1-9 0"/>
      <circle cx="7.5" cy="17.25" r="2.25"/>
      <circle cx="16.5" cy="10.5" r="1.5"/>
    </ng-container>

    <!-- Alert Circle (Emergency) -->
    <ng-container *ngSwitchCase="'alert-circle'">
      <circle cx="12" cy="12" r="10"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
      <line x1="12" y1="16" x2="12.01" y2="16"/>
    </ng-container>

    <!-- Shield (Vaccination) -->
    <ng-container *ngSwitchCase="'shield'">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <path d="m9 12 2 2 4-4"/>
    </ng-container>

    <!-- Heart Pulse -->
    <ng-container *ngSwitchCase="'heart-pulse'">
      <path d="M19.5 12.572l-7.5 7.428l-7.5-7.428a5 5 0 1 1 7.5-6.566a5 5 0 1 1 7.5 6.572"/>
      <path d="M3 12h4l2-4 4 8 2-4h4"/>
    </ng-container>

    <!-- Heart -->
    <ng-container *ngSwitchCase="'heart'">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </ng-container>

    <!-- Scan (Dermatology) -->
    <ng-container *ngSwitchCase="'scan'">
      <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
      <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
      <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
      <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
      <circle cx="12" cy="12" r="4"/>
    </ng-container>

    <!-- Smile (Dental) -->
    <ng-container *ngSwitchCase="'smile'">
      <circle cx="12" cy="12" r="10"/>
      <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
      <line x1="9" y1="9" x2="9.01" y2="9"/>
      <line x1="15" y1="9" x2="15.01" y2="9"/>
    </ng-container>

    <!-- Scissors -->
    <ng-container *ngSwitchCase="'scissors'">
      <circle cx="6" cy="6" r="3"/>
      <circle cx="6" cy="18" r="3"/>
      <line x1="20" y1="4" x2="8.12" y2="15.88"/>
      <line x1="14.47" y1="14.48" x2="20" y2="20"/>
      <line x1="8.12" y1="8.12" x2="12" y2="12"/>
    </ng-container>

    <!-- Bone (Ortho) -->
    <ng-container *ngSwitchCase="'bone'">
      <path d="M18.3 5.7a2.5 2.5 0 0 1 0 3.54L9.54 18a2.5 2.5 0 1 1-3.54-3.54l8.76-8.76a2.5 2.5 0 0 1 3.54 0z"/>
      <path d="M5.7 5.7a2.5 2.5 0 0 0 0 3.54"/>
      <path d="M18.3 18.3a2.5 2.5 0 0 0 0-3.54"/>
    </ng-container>

    <!-- Eye -->
    <ng-container *ngSwitchCase="'eye'">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
      <circle cx="12" cy="12" r="3"/>
    </ng-container>

    <!-- Brain -->
    <ng-container *ngSwitchCase="'brain'">
      <path d="M12 2a4 4 0 0 0-4 4c0 1.1.45 2.1 1.17 2.83L12 12"/>
      <path d="M12 2a4 4 0 0 1 4 4c0 1.1-.45 2.1-1.17 2.83L12 12"/>
      <path d="M8 6a4 4 0 0 0-4 4c0 1.1.45 2.1 1.17 2.83L8 16"/>
      <path d="M16 6a4 4 0 0 1 4 4c0 1.1-.45 2.1-1.17 2.83L16 16"/>
      <path d="M8 16a4 4 0 0 0-1 6h10a4 4 0 0 0-1-6"/>
      <line x1="12" y1="12" x2="12" y2="22"/>
    </ng-container>

    <!-- Flask (Lab) -->
    <ng-container *ngSwitchCase="'flask'">
      <path d="M9 3h6"/>
      <path d="M10 3v7.4a4 4 0 0 1-.9 2.5L5.4 17.4a2 2 0 0 0 1.5 3.3h10.2a2 2 0 0 0 1.5-3.3l-3.7-4.5a4 4 0 0 1-.9-2.5V3"/>
    </ng-container>

    <!-- Image (X-Ray) -->
    <ng-container *ngSwitchCase="'image'">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </ng-container>

    <!-- Pill (Pharmacy) -->
    <ng-container *ngSwitchCase="'pill'">
      <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/>
      <path d="m8.5 8.5 7 7"/>
    </ng-container>

    <!-- Sparkles (Grooming) -->
    <ng-container *ngSwitchCase="'sparkles'">
      <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      <path d="M5 3v4"/>
      <path d="M19 17v4"/>
      <path d="M3 5h4"/>
      <path d="M17 19h4"/>
    </ng-container>

    <!-- Bug (Deworming) -->
    <ng-container *ngSwitchCase="'bug'">
      <rect x="8" y="6" width="8" height="14" rx="4"/>
      <path d="m19 7-3 2"/>
      <path d="m5 7 3 2"/>
      <path d="m19 19-3-2"/>
      <path d="m5 19 3-2"/>
      <path d="M20 13h-4"/>
      <path d="M4 13h4"/>
      <path d="m10 4 1 2"/>
      <path d="m14 4-1 2"/>
    </ng-container>

    <!-- Apple (Nutrition) -->
    <ng-container *ngSwitchCase="'apple'">
      <path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 5-4 5-9.5C21 7.28 17.73 3 15 3c-1.25 0-2.5.5-3 1.5-.5-1-1.75-1.5-3-1.5C6.27 3 3 7.28 3 12.5 3 18 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/>
      <path d="M12 3c1 .5 2 2 2 5"/>
    </ng-container>

    <!-- Baby (Puppy/Kitten) -->
    <ng-container *ngSwitchCase="'baby'">
      <path d="M9 12h.01"/>
      <path d="M15 12h.01"/>
      <path d="M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/>
      <path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/>
    </ng-container>

    <!-- Clock -->
    <ng-container *ngSwitchCase="'clock'">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="12 6 12 12 16 14"/>
    </ng-container>

    <!-- Users -->
    <ng-container *ngSwitchCase="'users'">
      <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </ng-container>

    <!-- Grid -->
    <ng-container *ngSwitchCase="'grid'">
      <rect x="3" y="3" width="7" height="7"/>
      <rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/>
      <rect x="3" y="14" width="7" height="7"/>
    </ng-container>

    <!-- Phone -->
    <ng-container *ngSwitchCase="'phone'">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
    </ng-container>

    <!-- Map Pin -->
    <ng-container *ngSwitchCase="'map-pin'">
      <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
      <circle cx="12" cy="10" r="3"/>
    </ng-container>

    <!-- Mail -->
    <ng-container *ngSwitchCase="'mail'">
      <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
      <polyline points="22,6 12,13 2,6"/>
    </ng-container>

    <!-- Calendar -->
    <ng-container *ngSwitchCase="'calendar'">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </ng-container>

    <!-- Menu -->
    <ng-container *ngSwitchCase="'menu'">
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </ng-container>

    <!-- X (Close) -->
    <ng-container *ngSwitchCase="'x'">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </ng-container>

    <!-- Chevron Down -->
    <ng-container *ngSwitchCase="'chevron-down'">
      <polyline points="6 9 12 15 18 9"/>
    </ng-container>

    <!-- Chevron Right -->
    <ng-container *ngSwitchCase="'chevron-right'">
      <polyline points="9 18 15 12 9 6"/>
    </ng-container>

    <!-- Arrow Right -->
    <ng-container *ngSwitchCase="'arrow-right'">
      <line x1="5" y1="12" x2="19" y2="12"/>
      <polyline points="12 5 19 12 12 19"/>
    </ng-container>

    <!-- Shopping Cart -->
    <ng-container *ngSwitchCase="'shopping-cart'">
      <circle cx="9" cy="21" r="1"/>
      <circle cx="20" cy="21" r="1"/>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
    </ng-container>

    <!-- Shopping Bag -->
    <ng-container *ngSwitchCase="'shopping-bag'">
      <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
      <line x1="3" y1="6" x2="21" y2="6"/>
      <path d="M16 10a4 4 0 0 1-8 0"/>
    </ng-container>

    <!-- User -->
    <ng-container *ngSwitchCase="'user'">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
      <circle cx="12" cy="7" r="4"/>
    </ng-container>

    <!-- Home -->
    <ng-container *ngSwitchCase="'home'">
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </ng-container>

    <!-- Star -->
    <ng-container *ngSwitchCase="'star'">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </ng-container>

    <!-- Star Filled -->
    <ng-container *ngSwitchCase="'star-filled'">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" fill="currentColor"/>
    </ng-container>

    <!-- Paw -->
    <ng-container *ngSwitchCase="'paw'">
      <circle cx="11" cy="4" r="2"/>
      <circle cx="18" cy="8" r="2"/>
      <circle cx="4" cy="8" r="2"/>
      <path d="M12 18c-3.5 0-5-2.5-5-5 0-1.5.5-2.5 2-3.5S11.5 8 12 8s1.5.5 3 1.5 2 2 2 3.5c0 2.5-1.5 5-5 5z"/>
    </ng-container>

    <!-- Droplets -->
    <ng-container *ngSwitchCase="'droplets'">
      <path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.84-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/>
      <path d="M12.56 14.69c1.47 0 2.67-1.22 2.67-2.71 0-.77-.38-1.51-1.14-2.13S12.92 8.6 12.56 7.61c-.19.97-.76 1.9-1.53 2.52s-1.14 1.36-1.14 2.13c0 1.49 1.2 2.71 2.67 2.71z"/>
      <path d="M17 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S17.29 6.75 17 5.3c-.29 1.45-1.14 2.84-2.29 3.76S13 11.1 13 12.25c0 2.22 1.8 4.05 4 4.05z"/>
    </ng-container>

    <!-- Hand -->
    <ng-container *ngSwitchCase="'hand'">
      <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
      <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
      <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
      <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 13"/>
    </ng-container>

    <!-- Volume 2 (Ear) -->
    <ng-container *ngSwitchCase="'volume-2'">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
    </ng-container>

    <!-- Edit 3 (Nail) -->
    <ng-container *ngSwitchCase="'edit-3'">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
    </ng-container>

    <!-- Check -->
    <ng-container *ngSwitchCase="'check'">
      <polyline points="20 6 9 17 4 12"/>
    </ng-container>

    <!-- Message Circle -->
    <ng-container *ngSwitchCase="'message-circle'">
      <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
    </ng-container>

    <!-- Facebook -->
    <ng-container *ngSwitchCase="'facebook'">
      <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
    </ng-container>

    <!-- Instagram -->
    <ng-container *ngSwitchCase="'instagram'">
      <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
      <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
      <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
    </ng-container>

    <!-- Twitter / X -->
    <ng-container *ngSwitchCase="'twitter'">
      <path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/>
    </ng-container>

    <!-- YouTube -->
    <ng-container *ngSwitchCase="'youtube'">
      <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19.1c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.43z"/>
      <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/>
    </ng-container>

    <!-- Download -->
    <ng-container *ngSwitchCase="'download'">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </ng-container>

    <!-- Map -->
    <ng-container *ngSwitchCase="'map'">
      <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
      <line x1="8" y1="2" x2="8" y2="18"/>
      <line x1="16" y1="6" x2="16" y2="22"/>
    </ng-container>

    <!-- Search -->
    <ng-container *ngSwitchCase="'search'">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </ng-container>

    <!-- Award -->
    <ng-container *ngSwitchCase="'award'">
      <circle cx="12" cy="8" r="7"/>
      <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
    </ng-container>

    <!-- Zap (Emergency) -->
    <ng-container *ngSwitchCase="'zap'">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </ng-container>

    <!-- Play -->
    <ng-container *ngSwitchCase="'play'">
      <polygon points="5 3 19 12 5 21 5 3"/>
    </ng-container>

    <!-- Plus -->
    <ng-container *ngSwitchCase="'plus'">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </ng-container>

    <!-- Minus -->
    <ng-container *ngSwitchCase="'minus'">
      <line x1="5" y1="12" x2="19" y2="12"/>
    </ng-container>

    <!-- Trash -->
    <ng-container *ngSwitchCase="'trash'">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      <line x1="10" y1="11" x2="10" y2="17"/>
      <line x1="14" y1="11" x2="14" y2="17"/>
    </ng-container>

    <!-- Log Out -->
    <ng-container *ngSwitchCase="'log-out'">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </ng-container>

    <!-- Truck -->
    <ng-container *ngSwitchCase="'truck'">
      <rect x="1" y="3" width="15" height="13"/>
      <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
      <circle cx="5.5" cy="18.5" r="2.5"/>
      <circle cx="18.5" cy="18.5" r="2.5"/>
    </ng-container>

    <!-- Default fallback: circle -->
    <ng-container *ngSwitchDefault>
      <circle cx="12" cy="12" r="10"/>
    </ng-container>
  </ng-container>
</svg>
